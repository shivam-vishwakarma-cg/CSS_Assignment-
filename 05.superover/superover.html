<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Over</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            font-family: "Segoe UI", Arial, Helvetica, sans-serif;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 28px 24px 48px;
            background:
                radial-gradient(ellipse 60% 25% at 50% 62%, rgba(72, 118, 45, 0.35), transparent 70%),
                linear-gradient(
                    180deg,
                    #0a1526 0%,
                    #13263d 32%,
                    #22384d 46%,
                    #2c3b3d 52%,
                    #233b18 58%,
                    #1b2e11 78%,
                    #111e0a 100%
                );
            position: relative;
            overflow-x: hidden;
        }

        .stadium-stands {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 0;
            background:
                linear-gradient(90deg, rgba(10, 18, 28, 0.7) 0%, transparent 18%, transparent 82%, rgba(10, 18, 28, 0.7) 100%),
                linear-gradient(180deg, transparent 34%, rgba(20, 30, 40, 0.55) 35%, rgba(15, 22, 28, 0.65) 56%, transparent 57%);
        }

        .logo {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo svg {
            width: 44px;
            height: 44px;
            fill: #ffffff;
        }

        .logo-text {
            display: flex;
            flex-direction: column;
            font-size: 23px;
            font-weight: 800;
            line-height: 0.96;
            letter-spacing: 1px;
        }

        .scoreboard {
            position: relative;
            z-index: 1;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 88px;
            margin: 36px 0;
        }

        .team-card {
            width: 420px;
            border-radius: 14px;
            padding: 34px 28px 36px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35);
        }

        .team-ind {
            background-color: #15539e;
        }

        .team-pak {
            background-color: #459e48;
        }

        .team-name {
            font-size: 64px;
            font-weight: 700;
            line-height: 1.05;
            letter-spacing: 2px;
            margin-bottom: 36px;
        }

        .balls {
            display: flex;
            justify-content: center;
            gap: 14px;
            margin-bottom: 34px;
        }

        .ball {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background-color: #ffffff;
            color: #000000;
            font-size: 22px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .score {
            font-size: 46px;
            font-weight: 700;
            line-height: 1;
            letter-spacing: 2px;
        }

        .controls {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: center;
            gap: 56px;
        }

        .action-btn {
            width: 92px;
            height: 92px;
            border-radius: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s ease;
        }

        .action-btn:active {
            transform: translateY(3px);
        }

        .btn-bat {
            background: linear-gradient(180deg, #f8be44 0%, #f1a829 100%);
            border: 4px solid #fde2a3;
            box-shadow: 0 5px 0 #c98617, 0 10px 18px rgba(0, 0, 0, 0.45);
        }

        .btn-reset {
            background: linear-gradient(180deg, #f13b3b 0%, #de2424 100%);
            border: 4px solid #ffffff;
            box-shadow: 0 5px 0 #c7c7c7, 0 10px 18px rgba(0, 0, 0, 0.45);
        }

        .action-btn svg {
            width: 52px;
            height: 52px;
        }
    </style>
</head>
<body>
    <div class="stadium-stands"></div>

    <header class="logo">
        <svg viewBox="0 0 64 64" aria-hidden="true">
            <circle cx="24" cy="11" r="4.5"></circle>
            <path d="M18 18 L30 16 L36 26 L32 29 L27 23 L25 34 L33 47 L28 50 L21 38 L16 50 L11 48 L18 32 Z"></path>
            <path d="M31 24 L47 8 L50 11 L34 27 Z"></path>
            <circle cx="43" cy="44" r="10" fill="none" stroke="#ffffff" stroke-width="3"></circle>
            <path d="M37 37 Q43 44 37 51 M49 37 Q43 44 49 51" fill="none" stroke="#ffffff" stroke-width="2"></path>
        </svg>
        <div class="logo-text">
            <span>SUPER</span>
            <span>OVER</span>
        </div>
    </header>

    <main class="scoreboard">
        <section class="team-card team-ind">
            <h1 class="team-name">IND</h1>
            <div class="balls">
                <div class="ball">4</div>
                <div class="ball">3</div>
                <div class="ball">2</div>
                <div class="ball">6</div>
                <div class="ball">6</div>
                <div class="ball">6</div>
            </div>
            <div class="score">27/0</div>
        </section>

        <section class="team-card team-pak">
            <h1 class="team-name">PAK</h1>
            <div class="balls">
                <div class="ball">2</div>
                <div class="ball">4</div>
                <div class="ball">0</div>
                <div class="ball">3</div>
                <div class="ball">1</div>
                <div class="ball">4</div>
            </div>
            <div class="score">14/0</div>
        </section>
    </main>

    <div class="controls">
        <button class="action-btn btn-bat" aria-label="Strike">
            <svg viewBox="0 0 64 64" fill="none">
                <g transform="rotate(38 32 32)">
                    <rect x="29" y="6" width="6" height="16" rx="2" fill="#ffffff"></rect>
                    <rect x="25" y="21" width="14" height="35" rx="4" fill="#ffffff"></rect>
                </g>
            </svg>
        </button>

        <button class="action-btn btn-reset" aria-label="Reset">
            <svg viewBox="0 0 64 64" fill="none">
                <path d="M16 26 A18 18 0 1 1 20 45" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round"></path>
                <polygon points="9,22 23,25 13,34" fill="#ffffff"></polygon>
            </svg>
        </button>
    </div>
</body>
</html>
